<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web-Safe Colors — 216 Color Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="The 216-color web-safe palette with hex codes. Click any swatch to view details." />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="websafe">
  <!-- @include header -->

  <main class="container">
    <h1>Web-Safe Colors</h1>

    <section class="card">
      <p class="muted">
        The 216-color web-safe palette uses only the values
        <code>00, 33, 66, 99, CC, FF</code> for each RGB channel —
        guaranteeing the same rendering across all 256-color displays.
      </p>
      <div id="websafe-grid" class="websafe-grid"></div>
    </section>
  </main>

  <script src="/color.js"></script>
  <script src="/nav.js"></script>
  <script>
    (function () {
      const STEPS = ["00", "33", "66", "99", "CC", "FF"];
      const colors = [];
      for (const r of STEPS) {
        for (const g of STEPS) {
          for (const b of STEPS) {
            colors.push((r + g + b).toUpperCase());
          }
        }
      }

      document.getElementById("websafe-grid").innerHTML = colors
        .map((hex) => {
          const rgb = hex2rgb(hex);
          const textOn = readableTextOn(hex);
          return `
            <a class="ws-cell" href="/hex/${hex.toLowerCase()}"
               title="#${hex} — rgb(${rgb.red}, ${rgb.green}, ${rgb.blue})"
               style="background:#${hex};color:${textOn}">
              <span>#${hex}</span>
            </a>
          `;
        })
        .join("");
    })();
  </script>

  <!-- @include footer -->
</body>
</html>
