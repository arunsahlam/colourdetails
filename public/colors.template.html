<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Names — Search 450+ Named Colors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Search a list of named colors by name, hex, or source. Each color shows hex, RGB, and HSL with a link to full details." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="/colors.html" />
  <link rel="stylesheet" href="/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Named Colors",
    "description": "A searchable list of named colors with hex, RGB, and HSL values."
  }
  </script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Color Names</h1>
      <nav class="page-nav" aria-label="Tools">
        <a href="/index.html">Home</a>
        <a href="/websafe.html">Web-safe</a>
        <a href="/subtract.html">Subtract</a>
      </nav>
    </header>

    <section class="card">
      <div class="names-controls">
        <input
          id="names-search"
          type="search"
          placeholder="Search by name, hex, or source (e.g. lime, beff00, Pantone)…"
          autocomplete="off"
          aria-label="Search colors"
        />
        <select id="names-sort" aria-label="Sort order">
          <option value="name-asc">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
          <option value="hex-asc">Hex (ascending)</option>
          <option value="hue-asc">Hue (0 → 360)</option>
          <option value="light-asc">Lightness (dark → light)</option>
          <option value="light-desc">Lightness (light → dark)</option>
        </select>
        <span id="names-count" class="muted"></span>
      </div>
      <div id="names-grid" class="names-grid"></div>
      <p id="names-empty" class="muted" hidden>No colors match your search.</p>
      <div class="names-more-wrap">
        <button id="names-more" class="btn-more" hidden>Show more</button>
      </div>
    </section>
  </main>

  <!-- === Data block: replaced by scripts/build-colors.js === -->
  <script id="colors-data" type="application/json">[]</script>

  <script src="/color.js"></script>
  <script>
    (function () {
      "use strict";

      // ---- Load data (no fetch!) ----
      const ALL = JSON.parse(document.getElementById("colors-data").textContent);

      // ---- Elements ----
      const els = {
        search: document.getElementById("names-search"),
        sort:   document.getElementById("names-sort"),
        grid:   document.getElementById("names-grid"),
        count:  document.getElementById("names-count"),
        empty:  document.getElementById("names-empty"),
        more:   document.getElementById("names-more"),
      };

      // ---- State ----
      let filtered = [];
      let rendered = 0;
      const PAGE = 60;

      // ---- Helpers ----
      const hslCache = new Map();
      function getHSL(hex) {
        let v = hslCache.get(hex);
        if (!v) {
          v = hex2hsl(hex);
          hslCache.set(hex, v);
        }
        return v;
      }

      function primaryName(c) {
        return c.names[0] ? c.names[0].name : "Unnamed";
      }

      // Expand search: name, hex, any source, "Name (Source)" form
      function haystack(c) {
        if (c._hay) return c._hay;
        const parts = [c.hex];
        for (const n of c.names) {
          parts.push(n.name);
          parts.push(n.source);
          parts.push(`${n.name} (${n.source})`);
        }
        c._hay = parts.join(" \u0001 ").toLowerCase();
        return c._hay;
      }

      // ---- Filter ----
      function applyFilter() {
        const q = els.search.value.trim().toLowerCase().replace(/^#/, "");
        filtered = !q
          ? ALL.slice()
          : ALL.filter((c) => haystack(c).includes(q));

        const mode = els.sort.value;
        switch (mode) {
          case "name-desc":
            filtered.sort((a, b) => primaryName(b).localeCompare(primaryName(a)));
            break;
          case "hex-asc":
            filtered.sort((a, b) => a.hex.localeCompare(b.hex));
            break;
          case "hue-asc":
            filtered.sort((a, b) => getHSL(a.hex)[0] - getHSL(b.hex)[0]);
            break;
          case "light-asc":
            filtered.sort((a, b) => getHSL(a.hex)[2] - getHSL(b.hex)[2]);
            break;
          case "light-desc":
            filtered.sort((a, b) => getHSL(b.hex)[2] - getHSL(a.hex)[2]);
            break;
          case "name-asc":
          default:
            filtered.sort((a, b) => primaryName(a).localeCompare(primaryName(b)));
        }

        els.count.textContent =
          filtered.length === ALL.length
            ? `${ALL.length} colors`
            : `${filtered.length} of ${ALL.length} colors`;

        els.empty.hidden = filtered.length > 0;
        els.grid.innerHTML = "";
        rendered = 0;
        renderPage();
      }

      // ---- Card HTML ----
      function cardHTML(c) {
        const rgb = hex2rgb(c.hex);
        const [h, s, l] = getHSL(c.hex);
        const primary = primaryName(c);
        const extra = c.names.length - 1;
        const nameLine =
          extra > 0
            ? `${escapeHTML(primary)} <span class="name-more">+${extra}</span>`
            : escapeHTML(primary);

        const allNames = c.names
          .map((n) => `${n.name} (${n.source})`)
          .join(" · ");

        return `
          <a class="name-card" href="/hex/${c.hex.toLowerCase()}"
             title="${escapeAttr(allNames)}">
            <div class="name-swatch" style="background:#${c.hex}"></div>
            <div class="name-info">
              <strong>${nameLine}</strong>
              <code>#${c.hex}</code>
              <span class="muted">rgb(${rgb.red}, ${rgb.green}, ${rgb.blue})</span>
              <span class="muted">hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)</span>
            </div>
          </a>
        `;
      }

      function escapeHTML(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function escapeAttr(s) {
        return escapeHTML(s).replace(/"/g, "&quot;");
      }

      // ---- Paginated rendering ----
      function renderPage() {
        const next = filtered.slice(rendered, rendered + PAGE);
        if (next.length === 0) {
          els.more.hidden = true;
          return;
        }
        const frag = document.createElement("div");
        frag.innerHTML = next.map(cardHTML).join("");
        while (frag.firstChild) els.grid.appendChild(frag.firstChild);
        rendered += next.length;
        els.more.hidden = rendered >= filtered.length;
      }

      // ---- Wiring ----
      els.search.addEventListener("input", applyFilter);
      els.sort.addEventListener("change", applyFilter);
      els.more.addEventListener("click", renderPage);

      // Initial render
      applyFilter();
    })();
  </script>
</body>
</html>
