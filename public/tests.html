<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Conversion Tests</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .test-summary {
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .test-summary.pass { background: rgba(22, 163, 74, 0.12); color: #16a34a; }
    .test-summary.fail { background: rgba(220, 38, 38, 0.12); color: #dc2626; }
    .test-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .test-table th, .test-table td {
      border: 1px solid #e2e8f0;
      padding: 6px 8px;
      text-align: left;
      font-family: ui-monospace, Menlo, monospace;
    }
    .test-table tr.pass td:first-child { color: #16a34a; }
    .test-table tr.fail { background: rgba(220, 38, 38, 0.06); }
    .test-table tr.fail td:first-child { color: #dc2626; font-weight: 700; }
    .test-group { margin-bottom: 24px; }
    .test-group h2 { font-size: 1rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Color Conversion Tests</h1>
    <div id="summary" class="test-summary">Running…</div>
    <div id="results"></div>
  </main>

  <script src="/color.js"></script>
  <script src="/harmony.js"></script>
  <script>
    // ------------------------------------------------------------
    // Tiny test harness
    // ------------------------------------------------------------
    const results = [];
    let passed = 0;
    let failed = 0;

    function approx(a, b, eps = 0.005) {
      if (Array.isArray(a) && Array.isArray(b)) {
        if (a.length !== b.length) return false;
        return a.every((v, i) => approx(v, b[i], eps));
      }
      if (typeof a === "number" && typeof b === "number") {
        return Math.abs(a - b) <= eps;
      }
      return a === b;
    }

    function fmt(v) {
      if (Array.isArray(v)) return "[" + v.map((n) => typeof n === "number" ? n.toFixed(4) : n).join(", ") + "]";
      if (typeof v === "number") return v.toFixed(4);
      return String(v);
    }

    function test(group, name, actual, expected, eps) {
      const ok = approx(actual, expected, eps);
      ok ? passed++ : failed++;
      results.push({ group, name, actual, expected, ok });
    }

    // ------------------------------------------------------------
    // RGB ↔ HEX
    // ------------------------------------------------------------
    test("RGB ↔ HEX", "hex2rgb(#ff0000)", hex2rgb("ff0000"), { red: 255, green: 0, blue: 0 });
    test("RGB ↔ HEX", "hex2rgb(#00ff00)", hex2rgb("00ff00"), { red: 0, green: 255, blue: 0 });
    test("RGB ↔ HEX", "hex2rgb(#0000ff)", hex2rgb("0000ff"), { red: 0, green: 0, blue: 255 });
    test("RGB ↔ HEX", "hex2rgb(#ffffff)", hex2rgb("ffffff"), { red: 255, green: 255, blue: 255 });
    test("RGB ↔ HEX", "hex2rgb(#000000)", hex2rgb("000000"), { red: 0, green: 0, blue: 0 });
    test("RGB ↔ HEX", "hex2rgb(#fff) short", hex2rgb("fff"), { red: 255, green: 255, blue: 255 });
    test("RGB ↔ HEX", "rgb2hex([1,0,0])", rgb2hex([1, 0, 0]), "FF0000");
    test("RGB ↔ HEX", "rgb2hex([0,1,0])", rgb2hex([0, 1, 0]), "00FF00");
    test("RGB ↔ HEX", "rgb2hex([0,0,1])", rgb2hex([0, 0, 1]), "0000FF");

    // ------------------------------------------------------------
    // HSL
    // ------------------------------------------------------------
    test("HSL", "#ff0000 → hsl(0, 1, 0.5)", hex2hsl("ff0000"), [0, 1, 0.5]);
    test("HSL", "#00ff00 → hsl(1/3, 1, 0.5)", hex2hsl("00ff00"), [1 / 3, 1, 0.5]);
    test("HSL", "#0000ff → hsl(2/3, 1, 0.5)", hex2hsl("0000ff"), [2 / 3, 1, 0.5]);
    test("HSL", "#ffffff → hsl(0, 0, 1)", hex2hsl("ffffff"), [0, 0, 1]);
    test("HSL", "#000000 → hsl(0, 0, 0)", hex2hsl("000000"), [0, 0, 0]);
    test("HSL", "#808080 → hsl(0, 0, 0.502)", hex2hsl("808080"), [0, 0, 0.50196], 0.01);
    test("HSL", "#ff8000 → hue 30°", hex2hsl("ff8000"), [30 / 360, 1, 0.5], 0.01);

    test("HSL", "hsl2hex([0, 1, 0.5]) → FF0000", hsl2hex([0, 1, 0.5]), "FF0000");
    test("HSL", "hsl2hex([1/3, 1, 0.5]) → 00FF00", hsl2hex([1 / 3, 1, 0.5]), "00FF00");
    test("HSL", "hsl2hex([2/3, 1, 0.5]) → 0000FF", hsl2hex([2 / 3, 1, 0.5]), "0000FF");
    test("HSL", "hsl2hex([0, 0, 0.5]) → 808080", hsl2hex([0, 0, 0.5]), "808080");

    // ------------------------------------------------------------
    // HSV
    // ------------------------------------------------------------
    test("HSV", "#ff0000 → hsv(0, 1, 1)", hex2hsv("ff0000"), [0, 1, 1]);
    test("HSV", "#00ff00 → hsv(1/3, 1, 1)", hex2hsv("00ff00"), [1 / 3, 1, 1]);
    test("HSV", "#0000ff → hsv(2/3, 1, 1)", hex2hsv("0000ff"), [2 / 3, 1, 1]);
    test("HSV", "#808080 → hsv(0, 0, 0.502)", hex2hsv("808080"), [0, 0, 0.50196], 0.01);

    // ------------------------------------------------------------
    // CMYK
    // ------------------------------------------------------------
    test("CMYK", "#ffffff → cmyk(0,0,0,0)", hex2cmyk("ffffff"), [0, 0, 0, 0]);
    test("CMYK", "#000000 → cmyk(0,0,0,1)", hex2cmyk("000000"), [0, 0, 0, 1]);
    test("CMYK", "#ff0000 → cmyk(0,1,1,0)", hex2cmyk("ff0000"), [0, 1, 1, 0]);
    test("CMYK", "#00ff00 → cmyk(1,0,1,0)", hex2cmyk("00ff00"), [1, 0, 1, 0]);
    test("CMYK", "#0000ff → cmyk(1,1,0,0)", hex2cmyk("0000ff"), [1, 1, 0, 0]);

    // ------------------------------------------------------------
    // XYZ
    // ------------------------------------------------------------
    // Reference: sRGB D65, Y for white ≈ 100
    test("XYZ", "#ffffff → Y ≈ 100", rgb2xyz([1, 1, 1])[1], 100, 0.1);
    test("XYZ", "#000000 → Y = 0", rgb2xyz([0, 0, 0])[1], 0, 0.001);
    // Known value: #ff0000 → X≈41.24, Y≈21.26, Z≈1.93
    test("XYZ", "#ff0000 X", rgb2xyz([1, 0, 0])[0], 41.24, 0.1);
    test("XYZ", "#ff0000 Y", rgb2xyz([1, 0, 0])[1], 21.26, 0.1);
    test("XYZ", "#ff0000 Z", rgb2xyz([1, 0, 0])[2], 1.93, 0.1);

    // ------------------------------------------------------------
    // CIELAB
    // ------------------------------------------------------------
    // Reference: #ffffff → L≈100, a≈0, b≈0
    const whiteXYZ = rgb2xyz([1, 1, 1]);
    test("CIELAB", "#ffffff L≈100", xyz2cielab(whiteXYZ)[0], 100, 0.1);
    test("CIELAB", "#ffffff a≈0", xyz2cielab(whiteXYZ)[1], 0, 0.1);
    test("CIELAB", "#ffffff b≈0", xyz2cielab(whiteXYZ)[2], 0, 0.1);
    const blackXYZ = rgb2xyz([0, 0, 0]);
    test("CIELAB", "#000000 L≈0", xyz2cielab(blackXYZ)[0], 0, 0.1);

    // ------------------------------------------------------------
    // Websafe
    // ------------------------------------------------------------
    test("Websafe", "#ffffff → FFFFFF", hex2websafe("ffffff"), "FFFFFF");
    test("Websafe", "#000000 → 000000", hex2websafe("000000"), "000000");
    test("Websafe", "#ff0000 → FF0000", hex2websafe("ff0000"), "FF0000");
    test("Websafe", "#beff00 → CCFF00", hex2websafe("beff00"), "CCFF00");
    test("Websafe", "#ff8000 → FF9900", hex2websafe("ff8000"), "FF9900");

    // ------------------------------------------------------------
    // Inverse
    // ------------------------------------------------------------
    test("Inverse", "#000000 → FFFFFF", hex2inverse("000000"), "FFFFFF");
    test("Inverse", "#ffffff → 000000", hex2inverse("ffffff"), "000000");
    test("Inverse", "#ff0000 → 00FFFF", hex2inverse("ff0000"), "00FFFF");
    test("Inverse", "#beff00 → 4100FF", hex2inverse("beff00"), "4100FF");

    // ------------------------------------------------------------
    // Grayscale
    // ------------------------------------------------------------
    test("Grayscale", "#ffffff → FFFFFF", hex2grayscale("ffffff"), "FFFFFF");
    test("Grayscale", "#000000 → 000000", hex2grayscale("000000"), "000000");
    test("Grayscale", "#ff0000 → 4C4C4C", hex2grayscale("ff0000"), "4C4C4C");

    // ------------------------------------------------------------
    // Contrast ratio
    // ------------------------------------------------------------
    test("Contrast", "white/black = 21", contrastRatio("ffffff", "000000"), 21, 0.1);
    test("Contrast", "same color = 1", contrastRatio("ff0000", "ff0000"), 1, 0.01);
    test("Contrast", "symmetric", contrastRatio("ffffff", "808080"), contrastRatio("808080", "ffffff"));

    // ------------------------------------------------------------
    // Harmony round-trip
    // ------------------------------------------------------------
    const c = hex2complementary("ff0000");
    test("Harmony", "complementary of #ff0000 is #00FFFF", c, "00FFFF");

    const tri = hex2triadic("ff0000");
    // #ff0000 → +120° = #00FF00, +240° = #0000FF
    test("Harmony", "triadic of #ff0000 contains 00FF00", tri[0], "00FF00");
    test("Harmony", "triadic of #ff0000 contains 0000FF", tri[1], "0000FF");

    const split = hex2splitcomplementary("ff0000");
    // +150° ≈ cyan-ish green, +210° ≈ cyan-ish blue
    test("Harmony", "split of #ff0000 produces 2 colors", split.length, 2);

    // Round-trip: complementary twice returns original
    test("Harmony", "complementary is involutive", hex2complementary(hex2complementary("ff0000")), "FF0000");

    // ------------------------------------------------------------
    // Verdict sanity
    // ------------------------------------------------------------
    const vWhite = colorVerdict("ffffff");
    test("Verdict", "white → body text avoid", vWhite.body.label, "Avoid");
    const vBlack = colorVerdict("000000");
    test("Verdict", "black → body text avoid", vBlack.body.label, "Avoid");
    const vLime = colorVerdict("beff00");
    test("Verdict", "BEFF00 → strong accent", vLime.accent.label, "Strong accent");

    // ------------------------------------------------------------
    // Render results
    // ------------------------------------------------------------
    const summary = document.getElementById("summary");
    if (failed === 0) {
      summary.className = "test-summary pass";
      summary.textContent = `✓ All ${passed} tests passed`;
    } else {
      summary.className = "test-summary fail";
      summary.textContent = `✗ ${failed} of ${passed + failed} tests failed`;
    }

    // Group results by `group`
    const grouped = {};
    for (const r of results) {
      (grouped[r.group] = grouped[r.group] || []).push(r);
    }

    const container = document.getElementById("results");
    container.innerHTML = Object.entries(grouped).map(([group, items]) => `
      <div class="test-group">
        <h2>${group}</h2>
        <table class="test-table">
          <thead><tr><th>Status</th><th>Test</th><th>Actual</th><th>Expected</th></tr></thead>
          <tbody>
            ${items.map((r) => `
              <tr class="${r.ok ? "pass" : "fail"}">
                <td>${r.ok ? "✓" : "✗"}</td>
                <td>${r.name}</td>
                <td>${fmt(r.actual)}</td>
                <td>${fmt(r.expected)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `).join("");
  </script>
</body>
</html>
