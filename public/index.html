<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EYJ4WV7T5W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EYJ4WV7T5W');
  </script>
</head>
<body>
  <main class="container">
    <h1>Color Preview</h1>

    <form id="color-form">
      <label for="color-input">Enter a color code (hex):</label>
      <input
        id="color-input"
        type="text"
        placeholder="e.g. ff5733 or #ff5733"
        autocomplete="off"
        required
      />
      <button type="submit">Preview</button>
    </form>

    <div id="preview" class="preview">
      <div class="preview-swatch" id="preview-swatch"></div>
      <div class="preview-info" id="preview-info">
        Enter a color code to see a preview.
      </div>
    </div>

    <!-- Dynamic detail sections populated by app.js -->
    <section id="color-spaces" class="card"></section>
    <section id="base-numbers" class="card"></section>
    <section id="harmonies" class="card"></section>
    <section id="monochromatic" class="card"></section>
    <section id="related-colors" class="card"></section>
    <section id="css-examples" class="card"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
